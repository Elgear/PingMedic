name: Apply main window hover tooltips

on:
  push:
    branches:
      - ui/align-top-controls
    paths:
      - ".github/workflows/apply-main-tooltips.yml"

permissions:
  contents: write

jobs:
  patch-tooltips:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ui/align-top-controls

      - name: Add concise hover descriptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("PingerApp/PingerApp.py")
          text = path.read_text(encoding="utf-8")
          marker = "        tools_group.setLayout(tools_layout)\n"
          if marker not in text:
              raise SystemExit("Tools layout marker not found")

          block = r'''

        # §3.B.e Context help / hover descriptions
        # Keep the main window uncluttered while making controls self-explanatory.
        button_tooltips = {
            "Start": "Start continuous ping monitoring for the host shown in Target.",
            "Stop": "Stop the current ping monitoring session.",
            "Pause": "Temporarily pause ping sampling without resetting the current session statistics.",
            "Resume": "Resume ping sampling for the current session.",
            "Save": "Save the current target as a reusable preset.",
            "Del": "Delete the currently selected target preset.",
            "Reset Stats": "Reset alert counters and calculated session statistics without changing the target.",
            "Default": "Restore the default value for this monitoring setting.",
            "Latency Alerts: ON": "Toggle latency threshold alerts. A breach is counted when latency exceeds the configured limit.",
            "Latency Alerts: OFF": "Turn latency threshold alerts back on.",
            "Loss Alerts: ON": "Toggle packet-loss alerts. A breach is counted when loss exceeds the configured percentage.",
            "Loss Alerts: OFF": "Turn packet-loss alerts back on.",
            "Jitter Alerts: ON": "Toggle jitter alerts. A breach is counted when variation between ping times exceeds the configured limit.",
            "Jitter Alerts: OFF": "Turn jitter alerts back on.",
            "Best Avg: ON": "Show or hide the best-10 average line on the latency graph.",
            "Best Avg: OFF": "Show the best-10 average line on the latency graph.",
            "Worst Avg: ON": "Show or hide the worst-10 average line on the latency graph.",
            "Worst Avg: OFF": "Show the worst-10 average line on the latency graph.",
            "Comb Avg: ON": "Show or hide the combined latency average line on the graph.",
            "Comb Avg: OFF": "Show the combined latency average line on the graph.",
            "Min: ON": "Show or hide the minimum jitter reference line.",
            "Min: OFF": "Show the minimum jitter reference line.",
            "Max: ON": "Show or hide the maximum jitter reference line.",
            "Max: OFF": "Show the maximum jitter reference line.",
            "Avg: ON": "Show or hide the average jitter reference line.",
            "Avg: OFF": "Show the average jitter reference line.",
            "Auto-scale: ON": "Automatically adjust graph axes to keep current measurements readable.",
            "Auto-scale: OFF": "Use the current fixed graph scale instead of automatically resizing it.",
            "Speed Test": "Measure internet download/upload performance using the configured speed-test engine.",
            "Adapter Info": "Show details about the active network adapter, link speed and connection state.",
            "LAN Throughput": "Test throughput across the local network using the bundled iperf3 tooling.",
            "Gateway Stability": "Test the default gateway repeatedly to identify local-router latency, loss or instability.",
            "Loaded Latency": "Measure latency while the connection is under load to reveal bufferbloat or congestion effects.",
            "Route Health": "Inspect the path toward the target and highlight routing or hop-level problems.",
            "Wi-Fi Diagnostics": "Inspect Wi-Fi connection details such as signal, channel and link characteristics.",
            "Speed Targets": "Configure or run saved targets used for speed and connectivity checks.",
            "Network Scanner": "Discover devices on the local network and perform safe TCP reachability checks.",
            "HTTP Test": "Test HTTP/HTTPS reachability and basic response information for a web endpoint.",
            "DNS / WHOIS": "Resolve DNS information and retrieve available registration details for a domain.",
            "DNS Compare": "Compare DNS resolution results or response behaviour across resolvers.",
            "MTU Test": "Estimate the largest packet size that can travel without fragmentation on the current path.",
            "Traceroute": "Trace the network path to the target and show the intermediate hops.",
            "Alerts": "Open alert-related information and current breach status.",
            "Report": "Generate or export a summary of the current diagnostic session.",
            "Help": "Open PingerApp help and usage guidance.",
        }
        for button in self.findChildren(QPushButton):
            tip = button_tooltips.get(button.text().strip())
            if tip:
                button.setToolTip(tip)

        # Main target/status controls.
        main_control_tips = {
            "host_input": "Host name or IP address to monitor continuously, for example 8.8.8.8 or example.com.",
            "target_preset_combo": "Select a previously saved monitoring target.",
            "reverse_dns_disp": "Reverse-DNS name resolved for the current target when one is available.",
            "live_latency": "Most recent round-trip ping latency. Lower and more stable values are generally better.",
            "rtt_health_label": "Overall latency health based on the current measurements and configured threshold.",
            "live_jitter": "Current jitter: variation between successive latency measurements. Lower is generally better.",
            "jitter_health_label": "Jitter health based on current variation and the configured jitter threshold.",
            "elapsed_display": "Elapsed time for the current monitoring session.",
        }
        for attr, tip in main_control_tips.items():
            widget = getattr(self, attr, None)
            if widget is not None:
                widget.setToolTip(tip)

        # Sliders are intentionally contextual: their row label identifies the
        # setting, while the tooltip explains how the control behaves.
        for slider in self.findChildren(QSlider):
            slider.setToolTip(
                "Adjust this monitoring threshold or history setting. "
                "The value shown beside this row is the active value; changes affect live monitoring immediately."
            )

        # Explain the two primary graphs without adding permanent help text.
        canvases = self.findChildren(FigureCanvas)
        if len(canvases) >= 1:
            canvases[0].setToolTip(
                "Latency graph: plots ping round-trip time over the current history window. "
                "Reference lines show enabled averages and the configured latency threshold."
            )
        if len(canvases) >= 2:
            canvases[1].setToolTip(
                "Jitter graph: plots variation between successive ping latency measurements. "
                "Lower, steadier values indicate a more consistent connection."
            )
'''

          if "# §3.B.e Context help / hover descriptions" in text:
              raise SystemExit("Tooltip block already present")
          text = text.replace(marker, marker + block, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate Python syntax
        run: python -m py_compile PingerApp/PingerApp.py

      - name: Commit tooltip change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PingerApp/PingerApp.py
          git diff --cached --check
          git commit -m "Add hover descriptions to main controls"
          git push origin HEAD:ui/align-top-controls

name: Apply Route Health UI polish

on:
  push:
    branches:
      - fix/diagnostic-ui-polish
    paths:
      - scripts/patch_route_health_ui.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/diagnostic-ui-polish
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_route_health_ui.py
      - name: Validate Python
        run: python -m py_compile PingerApp/PingerApp.py
      - name: Commit result and remove helpers
        shell: pwsh
        run: |
          Remove-Item scripts/patch_route_health_ui.py
          Remove-Item .github/workflows/apply-route-health-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PingerApp/PingerApp.py scripts/patch_route_health_ui.py .github/workflows/apply-route-health-ui.yml
          git commit -m "Polish Route Health results presentation"
          git push origin HEAD:fix/diagnostic-ui-polish

name: Apply user data path fix

on:
  push:
    branches:
      - ui/responsive-main-layout
    paths:
      - "scripts/patch_user_data_path.py"

permissions:
  contents: write

jobs:
  patch-data-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/responsive-main-layout
      - run: python scripts/patch_user_data_path.py
      - run: python -m py_compile PingerApp/PingerApp.py
      - run: git diff --check
      - shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add PingerApp/PingerApp.py
          git commit -m "Store writable app data in user profile"
          git push origin HEAD:ui/responsive-main-layout

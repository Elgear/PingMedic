name: Apply PR3 responsive layout

on:
  push:
    branches:
      - ui/align-top-controls
    paths:
      - "scripts/patch_pr3_responsive_layout.py"

permissions:
  contents: write

jobs:
  patch-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ui/align-top-controls

      - name: Apply responsive layout patch
        run: python scripts/patch_pr3_responsive_layout.py

      - name: Validate Python
        run: |
          python -m py_compile PingerApp/PingerApp.py
          git diff --check

      - name: Remove temporary patch files and commit
        shell: bash
        run: |
          rm -f scripts/patch_pr3_responsive_layout.py .github/workflows/apply-pr3-responsive-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Improve responsive startup and summary layout"
          git push origin HEAD:ui/align-top-controls

name: Patch PR3 UI readability

on:
  pull_request_target:
    types: [synchronize, opened, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-pr3:
    if: github.event.pull_request.head.ref == 'ui/align-top-controls'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ui/align-top-controls
          fetch-depth: 0

      - name: Load trusted patch script from main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:scripts/patch_pr3_ui_readability.py > /tmp/patch_pr3.py

      - name: Apply UI readability fixes
        shell: bash
        run: python /tmp/patch_pr3.py

      - name: Validate patched Python
        shell: bash
        run: |
          python -m py_compile PingerApp/PingerApp.py
          git diff --check

      - name: Commit PR3 fixes if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "PR3 is already patched."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Improve graph readability and hover help"
          git push origin HEAD:ui/align-top-controls

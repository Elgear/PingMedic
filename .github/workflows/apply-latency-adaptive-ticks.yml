name: Apply latency adaptive ticks

on:
  push:
    branches:
      - ui/responsive-main-layout
    paths:
      - "scripts/patch_latency_adaptive_ticks.py"

permissions:
  contents: write

jobs:
  patch-latency-axis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/responsive-main-layout
      - run: python scripts/patch_latency_adaptive_ticks.py
      - run: |
          python -m py_compile PingerApp/PingerApp.py
          git diff --check
      - shell: bash
        run: |
          rm -f scripts/patch_latency_adaptive_ticks.py .github/workflows/apply-latency-adaptive-ticks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use adaptive latency graph ticks"
          git push origin HEAD:ui/responsive-main-layout

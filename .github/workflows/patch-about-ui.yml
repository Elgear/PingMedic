name: Patch About UI

on:
  push:
    branches:
      - release/about-security-hardening
    paths:
      - "scripts/patch_about_ui.py"

permissions:
  contents: write

jobs:
  patch-about:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: release/about-security-hardening

      - name: Apply About UI patch
        run: python scripts/patch_about_ui.py

      - name: Validate Python
        run: |
          python -m py_compile PingerApp/PingerApp.py
          python -m py_compile PingerApp/version.py
          git diff --check

      - name: Commit patched application and remove helper
        shell: bash
        run: |
          rm -f scripts/patch_about_ui.py .github/workflows/patch-about-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add About and release information to PingerApp"
          git push origin HEAD:release/about-security-hardening

name: Apply tools panel full-width buttons

on:
  push:
    branches:
      - ui/align-top-controls
    paths:
      - ".github/workflows/apply-tools-width.yml"

permissions:
  contents: write

jobs:
  patch-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui/align-top-controls

      - name: Stretch Tools buttons to panel width
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("PingerApp/PingerApp.py")
          text = path.read_text(encoding="utf-8")

          old = '''        tools_layout = QVBoxLayout()\n        tools_layout.setContentsMargins(8,8,8,8)\n        tools_layout.setSpacing(10)\n        tools_layout.addWidget(self.speedtest_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.adapter_info_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.lan_throughput_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.gateway_stability_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.loaded_latency_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.route_health_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.wifi_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.speed_targets_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.port_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.http_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.dns_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.dns_compare_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.mtu_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.trace_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.alerts_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.report_tool_btn, 0, Qt.AlignCenter)\n        tools_layout.addWidget(self.help_tool_btn, 0, Qt.AlignCenter)\n'''

          new = '''        tools_layout = QVBoxLayout()\n        tools_layout.setContentsMargins(8,8,8,8)\n        tools_layout.setSpacing(10)\n        tool_buttons = [\n            self.speedtest_btn,\n            self.adapter_info_btn,\n            self.lan_throughput_btn,\n            self.gateway_stability_btn,\n            self.loaded_latency_btn,\n            self.route_health_btn,\n            self.wifi_tool_btn,\n            self.speed_targets_tool_btn,\n            self.port_tool_btn,\n            self.http_tool_btn,\n            self.dns_tool_btn,\n            self.dns_compare_tool_btn,\n            self.mtu_tool_btn,\n            self.trace_tool_btn,\n            self.alerts_btn,\n            self.report_tool_btn,\n            self.help_tool_btn,\n        ]\n        for button in tool_buttons:\n            # The buttons were originally fixed at 135 px. Release that width\n            # constraint so each one fills the usable Tools panel width.\n            button.setMinimumWidth(0)\n            button.setMaximumWidth(16777215)\n            button.setFixedHeight(30)\n            button.setSizePolicy(QSizePolicy.Expanding, QSizePolicy.Fixed)\n            tools_layout.addWidget(button)\n'''

          if old not in text:
              raise SystemExit("Tools layout block not found; no changes made")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate Python syntax
        run: python -m py_compile PingerApp/PingerApp.py

      - name: Commit tools width change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PingerApp/PingerApp.py
          git diff --cached --check
          git commit -m "Stretch Tools buttons to panel width"
          git push origin HEAD:ui/align-top-controls

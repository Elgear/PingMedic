name: Build Windows Installer

on:
  pull_request:
    paths:
      - "PingerApp/**"
      - "PingerApp.spec"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "installer/**"
      - "build_installer.ps1"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Determine version
        shell: pwsh
        run: |
          $appVersion = python -c "import runpy; print(runpy.run_path('PingerApp/version.py')['APP_VERSION'])"
          $appVersion = $appVersion.Trim()
          if (-not $appVersion) { throw "APP_VERSION could not be read from PingerApp/version.py" }

          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tagVersion = "${{ github.ref_name }}" -replace '^v',''
            if ($tagVersion -ne $appVersion) {
              throw "Tag version $tagVersion does not match APP_VERSION $appVersion"
            }
            $version = $appVersion
          } elseif ("${{ github.event_name }}" -eq "pull_request") {
            $version = "$appVersion-pr${{ github.event.pull_request.number }}"
          } else {
            $version = $appVersion
          }

          "PINGERAPP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PINGERAPP_APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Build PingerApp
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean PingerApp.spec
          if (-not (Test-Path "dist\PingerApp\PingerApp.exe")) { throw "PingerApp.exe was not created" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:PINGERAPP_VERSION" "installer\PingerApp.iss"
          if (-not (Get-ChildItem "release\PingerApp_Setup_*.exe" -ErrorAction SilentlyContinue)) { throw "Installer was not created" }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release\PingerApp_Setup_*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer not found for checksum generation" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256"
          "$hash  $($installer.Name)" | Set-Content -Path $checksumPath -Encoding ascii
          Write-Host "SHA256 $hash"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PingerApp-Windows-Installer-${{ env.PINGERAPP_VERSION }}
          path: |
            release/PingerApp_Setup_*.exe
            release/PingerApp_Setup_*.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release from version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = (Get-ChildItem "release\PingerApp_Setup_*.exe" | Select-Object -First 1).FullName
          $checksum = "$installer.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $checksum --clobber
          } else {
            gh release create $tag $installer $checksum --generate-notes --title "PingerApp $tag"
          }

      - name: Publish GitHub Release from manual run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:PINGERAPP_APP_VERSION"
          $installer = (Get-ChildItem "release\PingerApp_Setup_*.exe" | Select-Object -First 1).FullName
          $checksum = "$installer.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer $checksum --clobber
          } else {
            gh release create $tag $installer $checksum --target "${{ github.sha }}" --generate-notes --title "PingerApp $tag"
          }

name: Build Windows Installer

on:
  pull_request:
    paths:
      - "PingerApp/**"
      - "PingerApp.spec"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "installer/**"
      - "build_installer.ps1"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build/release (for example 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $version = "0.1.0-pr${{ github.event.pull_request.number }}"
          }
          "PINGERAPP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Build PingerApp
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean PingerApp.spec
          if (-not (Test-Path "dist\PingerApp\PingerApp.exe")) { throw "PingerApp.exe was not created" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:PINGERAPP_VERSION" "installer\PingerApp.iss"
          if (-not (Get-ChildItem "release\PingerApp_Setup_*.exe" -ErrorAction SilentlyContinue)) { throw "Installer was not created" }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingerApp-Windows-Installer-${{ env.PINGERAPP_VERSION }}
          path: release/PingerApp_Setup_*.exe
          if-no-files-found: error

      - name: Publish GitHub Release from version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = (Get-ChildItem "release\PingerApp_Setup_*.exe" | Select-Object -First 1).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --generate-notes --title "PingerApp $tag"
          }

      - name: Publish GitHub Release from manual run
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:PINGERAPP_VERSION"
          $installer = (Get-ChildItem "release\PingerApp_Setup_*.exe" | Select-Object -First 1).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
          } else {
            gh release create $tag $installer --target "${{ github.sha }}" --generate-notes --title "PingerApp $tag"
          }

name: Apply Latency Stats button width

on:
  push:
    branches:
      - ui/responsive-main-layout
    paths:
      - "scripts/patch_latency_stats_buttons.py"

permissions:
  contents: write

jobs:
  patch-buttons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ui/responsive-main-layout
      - run: python scripts/patch_latency_stats_buttons.py
      - run: |
          python -m py_compile PingerApp/PingerApp.py
          git diff --check
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PingerApp/PingerApp.py
          git diff --cached --check
          git commit -m "Fix Latency Stats button clipping"
          git push origin HEAD:ui/responsive-main-layout
